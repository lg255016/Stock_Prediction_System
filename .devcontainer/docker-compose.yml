version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    env_file:
      - ../.env

    volumes:
      - ../..:/workspaces:cached

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    # Runs app on the same network as the database container, allows "forwardPorts" in devcontainer.json function.
    network_mode: service:db

    # Docker Desktop 後端偶發自行重啟時（觀測到 2026-09-11 10:51、11:44 兩次，
    # 非 Windows 層級當機，Event Viewer 無對應紀錄），db 有 unless-stopped 會
    # 自動拉回來，app 原本沒設、停在 Exited 需手動 docker start——比照 db 補上。
    restart: unless-stopped

    # 本機（32GB／8核）與 fluora 專案共用 Docker，平分後每專案預算 8GB／3核
    # （2026-09-11 雙方已對齊）。本專案預算再拆三份：app 4GB／1.5核、
    # db 2GB／1核，**刻意保留 2GB／0.5核不分給常駐容器**，留給 RISK-013
    # 這類一次性備份還原驗證容器（啟動時另外加 --memory=2g --cpus=0.5，
    # 不得超過這個保留額度）。app 吃較多份額：測試套件、特徵全量計算、
    # 未來 Gate 3/4 的 ML 訓練（sklearn/lightgbm/xgboost）都在這裡跑。
    mem_limit: 4g
    cpus: 1.5

    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

  db:
    image: postgres:18
    restart: unless-stopped
    volumes:
      - ./postgres-data:/var/lib/postgresql
    env_file:
      - ../.env

    # 同上，db 份額較小——PostgreSQL 預設 shared_buffers 128MB 起跳，
    # 2GB 對目前資料量（449k+ 列查詢/join）綽綽有餘。
    mem_limit: 2g
    cpus: 1.0

    # Add "forwardPorts": [5432] to **devcontainer.json** to forward PostgreSQL locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

